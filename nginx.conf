server {
    listen 9085;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects nginx issues itself (e.g. /getting-started/roadmap -> .../roadmap/, because the
    # pre-rendered pages are directories) must be relative. An absolute Location would carry
    # nginx's own view: http (TLS ends in front of it) and the internal listen port 9085, so
    # visitors were sent to http://bcq-ui.brandcompete.com:9085/...
    absolute_redirect off;

    auth_basic "Restricted Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
