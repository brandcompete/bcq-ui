<!doctype html>
<html lang="en-us" xmlns=http://www.w3.org/1999/xhtml xmlns:og=http://opengraphprotocol.org/schema/ xmlns:fb=http://www.facebook.com/2008/fbml xmlns:fb="http://www.facebook.com/2008/fbml">
  <head>
    <meta charset="utf-8" />
    <title>{{documentTitle}}</title>
    <meta name="keywords" content="{{keywords}}" />
    <meta name="description" content="{{pageDescriptionMeta}}" />
    <meta property="og:description" content="{{pageDescriptionMeta}}">
    <link rel="icon" href="/images/icons/favicon.ico" />
    <meta name="theme-color" content="{{themeColor}}" />
    <meta name="msapplication-TileColor" content="{{themeColor}}" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="manifest" href="/data/miscellaneous/manifest.json" />
    <link rel="canonical" href="{{canonical}}">
    <link rel="apple-touch-icon" href="/images/icons/safari-pinned-tab.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="{{pageTitle}}" />
    <meta property="og:title" content="{{pageTitle}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:site_name" content="{{pageTitle}}" />
    <meta property="og:image" content="{{hostname}}images/thumbnails/{{thumbnail}}.png" />
    <meta name="twitter:image" content="{{hostname}}images/thumbnails/{{thumbnail}}.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Website",
      "headline": "{{pageTitle}}",
      "alternativeHeadline": "{{pageTitle}}",
      "editor": "{{vendor}}",
      "genre": "{{pageTitle}}",
      "image": "{{hostname}}images/thumbnails/{{thumbnail}}.png",
      "keywords": "{{keywords}}",
      "publisher": "{{vendor}}",
      "url": "{{canonical}}",
      "datePublished": "{{date}}",
      "dateCreated": "{{date}}",
      "dateModified": "{{date}}",
      "description": "{{pageDescriptionMeta}}",
      "author": {
        "@type": "Company",
        "name": "{{vendor}}"
      }
    }
    </script>
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="stylesheet" crossorigin href="/assets/index.css?r={{rnd}}" />
    <style>.seo-block {position: fixed; clip: rect(0 0 0 0);}</style>
  </head>
  <body>
    <div id="app"></div>
    <div class="seo-block">
      <h1>{{pageTitle}}</h1>
      <p>{{pageDescription}}</p>
      <p>
        <img src="{{hostname}}images/thumbnails/{{thumbnail}}.png" alt="{{hostname}}images/thumbnails/{{thumbnail}}.png" width="1200" height="630" class="block m-auto" />
      </p>
      <h2>{{appName}}</h2>
      <p>{{appDescripion}}</p>
      <ul>{{links}}</ul>
      <p>&copy;{{years}} {{copyright}}</p>
    </div>
    <noscript>This website makes heavy use of JavaScript, which seems to be disabled in your browser.
        To view it properly, please, enable JavaScript and reload the page.</noscript>
    <script type="module" crossorigin src="/assets/index.js?r={{rnd}}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@latest/css/flag-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.bubble.css" rel="stylesheet" />
    <!-- ssr snapshot created @ {{datestring}} -->
  </body>
</html>
